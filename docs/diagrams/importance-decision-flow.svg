<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">noti. 중요도 판단 흐름</title>
  <desc id="desc">알림 전처리부터 규칙, 개인화, 온디바이스 AI를 거쳐 최종 중요도를 결정하고 저장하는 과정</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF4FF"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2475F5"/><stop offset="1" stop-color="#6D7CFF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#233B68" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7890B6"/></marker>
    <style>
      .t{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#14213D}.h{font-size:42px;font-weight:800}.sub{font-size:20px;fill:#64748B}.label{font-size:22px;font-weight:750}.body{font-size:17px;fill:#64748B}.mini{font-size:15px;font-weight:700}.light{fill:#FFFFFF}.lightSub{fill:#EAF1FF}.line{fill:none;stroke:#7890B6;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="980" rx="36" fill="url(#bg)"/>
  <circle cx="1470" cy="88" r="150" fill="#DCE8FF" opacity=".48"/><circle cx="1420" cy="120" r="78" fill="none" stroke="#B8CCF5" stroke-width="2"/>
  <text x="76" y="82" class="t h">중요도 판단은 순서가 핵심입니다</text>
  <text x="76" y="120" class="t sub">확실한 규칙을 먼저 적용하고, 애매한 알림에만 개인화와 AI를 사용합니다.</text>

  <g transform="translate(76 165)">
    <rect width="1448" height="70" rx="20" fill="#FFFFFF" stroke="#DFE8F5"/>
    <g transform="translate(26 17)"><rect width="106" height="36" rx="18" fill="#E7F0FF"/><text x="53" y="24" text-anchor="middle" class="t mini" fill="#246FEB">1 · 규칙</text></g>
    <g transform="translate(150 17)"><rect width="124" height="36" rx="18" fill="#F0ECFF"/><text x="62" y="24" text-anchor="middle" class="t mini" fill="#6C55D9">2 · 개인화</text></g>
    <g transform="translate(292 17)"><rect width="100" height="36" rx="18" fill="#E8F8F0"/><text x="50" y="24" text-anchor="middle" class="t mini" fill="#16845B">3 · AI</text></g>
    <text x="1418" y="43" text-anchor="end" class="t body">앞 단계에서 확정되면 뒤 단계는 실행하지 않음</text>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(76 290)"><rect width="250" height="126" rx="24" fill="#FFFFFF" stroke="#DCE6F4"/><circle cx="46" cy="44" r="22" fill="#E7F0FF"/><path d="M38 43h16M41 37h10M41 49h10" stroke="#2F80ED" stroke-width="3" stroke-linecap="round"/><text x="82" y="48" class="t label">새 알림 수신</text><text x="28" y="86" class="t body">Android Notification</text><text x="28" y="108" class="t body">제목 · 본문 · 앱 · 채널</text></g>
    <g transform="translate(380 290)"><rect width="250" height="126" rx="24" fill="#FFFFFF" stroke="#DCE6F4"/><circle cx="46" cy="44" r="22" fill="#E7F0FF"/><path d="M37 37h18M37 44h13M37 51h16" stroke="#2F80ED" stroke-width="3" stroke-linecap="round"/><text x="82" y="48" class="t label">전처리</text><text x="28" y="86" class="t body">Parse · Normalize</text><text x="28" y="108" class="t body">Filter</text></g>
    <g transform="translate(684 290)"><rect width="300" height="126" rx="24" fill="#FFFFFF" stroke="#8BB8FF" stroke-width="2"/><rect x="22" y="22" width="38" height="38" rx="12" fill="#E7F0FF"/><text x="41" y="48" text-anchor="middle" class="t mini" fill="#246FEB">1</text><text x="78" y="48" class="t label">규칙 엔진</text><text x="28" y="86" class="t body">중요 앱 · 키워드 · 제외 규칙</text><text x="28" y="108" class="t body">설명 가능한 기본 점수 계산</text></g>
  </g>
  <path d="M326 353H368" class="line"/><path d="M630 353H672" class="line"/>

  <g transform="translate(1050 278)"><path d="M120 0L240 75L120 150L0 75Z" fill="#FFF8E8" stroke="#F2B84B" stroke-width="2"/><text x="120" y="68" text-anchor="middle" class="t label">강제 판정?</text><text x="120" y="96" text-anchor="middle" class="t body">isForced</text></g>
  <path d="M984 353H1038" class="line"/>

  <g filter="url(#shadow)" transform="translate(1308 290)"><rect width="216" height="126" rx="24" fill="#E9F8F1" stroke="#68C49B" stroke-width="2"/><text x="108" y="53" text-anchor="middle" class="t label" fill="#126A4D">최종 결과</text><text x="108" y="84" text-anchor="middle" class="t body">IMPORTANT</text><text x="108" y="106" text-anchor="middle" class="t body">REVIEW · GENERAL</text></g>
  <path d="M1290 353H1296" class="line"/><text x="1292" y="333" text-anchor="middle" class="t mini" fill="#16845B">예</text>

  <path d="M1170 428V492H326V528" class="line"/><text x="1190" y="466" class="t mini" fill="#64748B">아니요</text>
  <g filter="url(#shadow)" transform="translate(196 540)"><rect width="390" height="142" rx="26" fill="#FFFFFF" stroke="#A997F4" stroke-width="2"/><rect x="24" y="24" width="38" height="38" rx="12" fill="#F0ECFF"/><text x="43" y="50" text-anchor="middle" class="t mini" fill="#6C55D9">2</text><text x="82" y="51" class="t label">온디바이스 개인화</text><text x="26" y="93" class="t body">App · Channel · Topic 프로필 조회</text><text x="26" y="118" class="t body">점수 보정 범위 -15 ~ +15</text></g>

  <g transform="translate(686 536)"><path d="M130 0L260 75L130 150L0 75Z" fill="#FFF8E8" stroke="#F2B84B" stroke-width="2"/><text x="130" y="68" text-anchor="middle" class="t label">여전히 REVIEW?</text><text x="130" y="98" text-anchor="middle" class="t body">25 ≤ score &lt; 40</text></g>
  <path d="M586 611H674" class="line"/>
  <path d="M946 611H1065V438H1308" class="line"/><text x="1000" y="591" class="t mini" fill="#16845B">아니요</text>

  <path d="M816 686V742" class="line"/><text x="836" y="720" class="t mini" fill="#64748B">예</text>
  <g filter="url(#shadow)" transform="translate(606 754)"><rect width="420" height="148" rx="26" fill="url(#brand)"/><rect x="24" y="24" width="38" height="38" rx="12" fill="#FFFFFF" opacity=".2"/><text x="43" y="50" text-anchor="middle" class="t mini light">3</text><text x="82" y="51" class="t label light">KoEn-E5-Tiny ONNX</text><text x="26" y="94" class="t body lightSub">REVIEW 알림에만 온디바이스 추론</text><text x="26" y="120" class="t body lightSub">AI 확률 → 점수 · 판정 근거</text></g>

  <path d="M1026 828H1108" class="line"/>
  <g filter="url(#shadow)" transform="translate(1120 754)"><rect width="404" height="148" rx="26" fill="#FFFFFF" stroke="#DCE6F4"/><text x="28" y="48" class="t label">저장하고 화면에 표시</text><text x="28" y="87" class="t body">Room → Flow → ViewModel</text><text x="28" y="116" class="t body">→ Jetpack Compose UI</text></g>
</svg>
